<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Torneos | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --clay-orange: #C24E00;
            --clay-bg: #1e1e1e;
            --clay-card: #2d2d2d;
            --clay-text: #ffffff;
            --clay-accent: #d4f01e;
            --clay-border: #444;
            --danger-red: #d32f2f;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--clay-bg);
            color: var(--clay-text);
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(194, 78, 0, 0.15) 0%, transparent 50%);
        }
        .container {
            max-width: 1000px; margin: 20px auto;
            background-color: var(--clay-card);
            padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-top: 5px solid var(--clay-orange);
        }
        h1, h2 {
            color: var(--clay-orange); text-align: center;
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        /* CUADRÍCULA DE TORNEOS RESTRUCTURADA */
        .torneos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px; margin: 30px 0;
        }
        .torneo-card {
            background: #252525; border: 2px solid var(--clay-border);
            border-radius: 12px; padding: 20px; cursor: pointer;
            transition: all 0.25s ease; position: relative; overflow: hidden;
        }
        .torneo-card:hover {
            transform: translateY(-4px); border-color: var(--clay-orange);
            box-shadow: 0 6px 20px rgba(194, 78, 0, 0.2);
        }
        .torneo-card.selected {
            border-color: var(--clay-accent);
            background: #2a2c1f;
        }
        .torneo-card h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: #fff; }
        .badge {
            display: inline-block; padding: 4px 8px; border-radius: 4px;
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
        }
        .badge-cat { background-color: var(--clay-orange); color: white; }
        .badge-status { background-color: #444; color: #ccc; margin-left: 5px; }

        /* SECCIÓN DEL EDITOR */
        .editor-box {
            background: #1a1a1a; padding: 25px; border-radius: 12px;
            margin-top: 30px; border: 1px solid #333;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; }
        input[type="text"], select {
            width: 100%; padding: 12px; background: #252525;
            border: 1px solid var(--clay-border); color: white;
            border-radius: 6px; box-sizing: border-box;
        }
        .llave-item {
            display: flex; align-items: center; gap: 15px;
            margin-bottom: 12px; padding: 12px;
            background-color: #2b2b2b; border-radius: 8px;
        }
        .vs { font-weight: bold; color: var(--clay-accent); }
        .player-pair { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        
        .action-buttons { display: flex; gap: 15px; margin-top: 30px; }
        .btn {
            flex: 1; padding: 15px; color: white; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-update { background: var(--clay-orange); }
        .btn-delete { background: var(--danger-red); }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 Torneos Registrados</h1>
        <p style="text-align: center; color: #888;">Selecciona un torneo de la lista para editar sus llaves o eliminarlo:</p>
        
        <div class="torneos-grid" id="contenedorTorneos"></div>

        <div id="seccionEditor" class="editor-box" style="display: none;">
            <h2>⚙️ Modificar Torneo</h2>
            
            <div class="form-group">
                <label>Nombre del Torneo:</label>
                <input type="text" id="editNombre" required>
            </div>

            <div class="form-group">
                <label>Estado del Torneo:</label>
                <select id="editEstado">
                    <option value="SIN_JUGAR">Sin Jugar</option>
                    <option value="EN_CURSO">En Curso</option>
                    <option value="FINALIZADO">Finalizado</option>
                </select>
            </div>

            <div class="form-group">
                <label>Clasificación / Serie del Torneo:</label>
                <select id="editClasificacion">
                    <option value="Futuro 50">Futuro 50</option>
                    <option value="Futuro 100">Futuro 100</option>
                    <option value="Futuro 250">Futuro 250</option>
                    <option value="Futuro 500">Futuro 500</option>
                    <option value="Master 1000">Master 1000</option>
                </select>
            </div>

            <h3 id="tituloRondas">👥 Enfrentamientos del Torneo</h3>
            <div id="contenedorLlavesEdicion"></div>

            <div class="action-buttons">
                <button class="btn btn-update" onclick="actualizarTorneo()">💾 Guardar Cambios</button>
                <button class="btn btn-delete" onclick="eliminarTorneo()">🗑️ Eliminar Torneo</button>
            </div>
        </div>
    </div>

    <script src="editar-logic.js"></script>
</body>
</html>
