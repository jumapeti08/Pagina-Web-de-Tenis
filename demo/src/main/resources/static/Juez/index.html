<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Marcador de Tenis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pantalla">
        <div class="jugador">
            <h1 id="nombreJ1">Cargando...</h1>
            <div class="marcador-principal">
                <div class="item"><span>Games</span><p id="sumarGameJug1">0</p></div>
                <div class="item"><span>Sets</span><p id="setJug1">0</p></div>
            </div>
            <div class="puntos-control">
                <button class="btn-circular" onclick="restarJugador1()">-</button>
                <p class="puntaje" id="puntaje1">0</p>
                <button class="btn-circular" onclick="sumarJugador1()">+</button>
            </div>
            <div class="panel-stats">
                <button class="btn-s ace" onclick="registrarStat(1, 'ace')">Ace</button>
                <button class="btn-s doble" onclick="registrarStat(1, 'dobleFalta')">D. Falta</button>
                <button class="btn-s error" onclick="registrarStat(1, 'errorNo')">Error No F.</button>
                <button class="btn-s red" onclick="registrarStat(1, 'red')">Red</button>
                <button class="btn-s winner" onclick="registrarStat(1, 'winner')">Winner</button>
            </div>
        </div>

        <div class="divisor"></div>

        <div class="jugador">
            <h1 id="nombreJ2">Cargando...</h1>
            <div class="marcador-principal">
                <div class="item"><span>Games</span><p id="sumarGameJug2">0</p></div>
                <div class="item"><span>Sets</span><p id="setJug2">0</p></div>
            </div>
            <div class="puntos-control">
                <button class="btn-circular" onclick="restarJugador2()">-</button>
                <p class="puntaje" id="puntaje2">0</p>
                <button class="btn-circular" onclick="sumarJugador2()">+</button>
            </div>
            <div class="panel-stats">
                <button class="btn-s ace" onclick="registrarStat(2, 'ace')">Ace</button>
                <button class="btn-s doble" onclick="registrarStat(2, 'dobleFalta')">D. Falta</button>
                <button class="btn-s error" onclick="registrarStat(2, 'errorNo')">Error No F.</button>
                <button class="btn-s red" onclick="registrarStat(2, 'red')">Red</button>
                <button class="btn-s winner" onclick="registrarStat(2, 'winner')">Winner</button>
            </div>
        </div>
    </div>

    <div class="footer-controls">
        <button class="btn-finalizar" onclick="terminarManual('Normal')">🏁 Terminar Partido</button>
        <button class="btn-w" onclick="terminarManual('W')">🏆 Ganar por W</button>
        <button class="btn-r" onclick="terminarManual('R')">🚫 Retiro</button>
        <button class="btn-su" onclick="terminarManual('Su')">⏸️ Suspender</button>
        <p id="estado"></p>
    </div>

    <div id="modal-stats" class="modal-overlay">
        <div class="modal-box">
            <h2 class="modal-title">📊 Resumen del Partido</h2>
            <div class="tablas-wrapper">
                <div class="tabla-col">
                    <h3 id="modalNombreJ1" class="jugador-nombre">Jugador 1</h3>
                    <table id="tabla-j1" class="stats-table"></table>
                </div>
                <div class="tabla-col">
                    <h3 id="modalNombreJ2" class="jugador-nombre">Jugador 2</h3>
                    <table id="tabla-j2" class="stats-table"></table>
                </div>
            </div>
            
            <div class="modal-actions" style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button id="btn-guardar-bd" class="btn-finalizar" onclick="guardarYPasarSiguienteRonda()">💾 Guardar Resultado</button>
                <button class="btn-nuevo-partido" onclick="cerrarStats()" style="background-color: #555;">Salir al Panel</button>
            </div>
        </div>
    </div>

    <!-- Librerías para WebSockets (¡IMPORTANTE: Cargar antes de tu script.js!) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const matchId = urlParams.get('matchId');

            if (!matchId) {
                alert("Error: No se especificó un ID de partido.");
                window.location.href = "panel-juez.html";
                return;
            }

            localStorage.setItem('partidoIdEnCurso', matchId);

            try {
                console.log("Cargando y verificando partido:", matchId);
                
                // 1. Consumimos el endpoint de verificación para validar si el juez puede entrar
                const response = await fetch(`/api/torneos/partidos/${matchId}/verificar-arbitraje`);
                
                if (!response.ok) {
                    throw new Error("Error en la respuesta del servidor.");
                }
                
                const data = await response.json();
                console.log("Datos de verificación recibidos:", data);

                if (data.permitido === false) {
                    alert(`⚠️ Acceso denegado:\n${data.mensaje}`);
                    window.location.href = "panel-juez.html";
                    return;
                }

                // Guardamos el estado en el que venía (PROGRAMADO o SUSPENDIDO) antes de cambiarlo
                const estadoOriginal = data.estado;

                // =========================================================================
                // 🔥 SOLUCIÓN CRÍTICA: Traer el objeto PARTIDO completo de la Base de Datos
                // =========================================================================
                const respPartido = await fetch(`/api/torneos/partidos/${matchId}`);
                if (!respPartido.ok) throw new Error("No se pudieron obtener los datos detallados del partido.");
                const partidoCompleto = await respPartido.json();

                // =========================================================================
                // 🔥 SOLUCIÓN DOBLES: Formatear nombres según tipo de modalidad
                // =========================================================================
                let n1 = data.jugador1 || "Jugador 1";
                let n2 = data.jugador2 || "Jugador 2";

                if (data.tipoModalidad === "Dobles") {
                    const j1 = data.jugador1 || "Invitado 1";
                    const j2 = data.jugador2 || "Invitado 2";
                    const j3 = data.jugador3 || "Invitado 3";
                    const j4 = data.jugador4 || "Invitado 4";

                    n1 = `${j1} / ${j2}`;
                    n2 = `${j3} / ${j4}`;
                }

                document.getElementById('nombreJ1').innerText = n1;
                document.getElementById('nombreJ2').innerText = n2;
                
                if (document.getElementById('modalNombreJ1')) {
                    document.getElementById('modalNombreJ1').innerText = n1;
                    document.getElementById('modalNombreJ2').innerText = n2;
                }
                // =========================================================================

                // 2. Cambiar el estado del partido a EN_CURSO en el servidor de inmediato
                await cambiarEstadoPartidoAEnCurso(matchId);

                // 3. Montar los puntos, games y sets que estaban guardados en la BD (si existen)
                if (typeof cargarDatosPartidoExistente === 'function') {
                    cargarDatosPartidoExistente(partidoCompleto);
                }

                // 4. ¿Preguntar por el servicio inicial?
                // SOLO se pregunta si es un partido nuevo de paquete (PROGRAMADO y sin marcadores en BD)
                const tieneProgreso = partidoCompleto.puntosActualesJ1 || partidoCompleto.setsGanadosJ1 > 0 || partidoCompleto.setsGanadosJ2 > 0;
                
                if (estadoOriginal === "PROGRAMADO" && !tieneProgreso) {
                    preguntarServicioInicial(n1, n2);
                } else {
                    console.log("Reanudando partido suspendido o con datos previos. Se mantiene el saque/marcador de la BD.");
                    if (typeof actualizarBotonesServicio === 'function') {
                        actualizarBotonesServicio();
                    }
                }

            } catch (error) {
                console.error("Error cargando el partido:", error);
                alert("Hubo un error de red o de base de datos al inicializar el arbitraje.");
                window.location.href = "panel-juez.html";
            }
        });

        // Función para cambiar el estado a EN_CURSO en la BD
        async function cambiarEstadoPartidoAEnCurso(id) {
            try {
                await fetch(`/api/torneos/partidos/${id}/cambiar-estado`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: "EN_CURSO" })
                });
                console.log("Estado cambiado con éxito a: EN_CURSO");
            } catch (err) {
                console.error("No se pudo actualizar el estado en el servidor:", err);
            }
        }

        // Función interactiva para definir el saque inicial
        function preguntarServicioInicial(jugador1, jugador2) {
            let seleccion = prompt(`¿Quién inicia sirviendo?\n1. ${jugador1}\n2. ${jugador2}`, "1");
            
            if (typeof marcarServicio === 'function') {
                if (seleccion === "2") marcarServicio(2);
                else marcarServicio(1);
            } else if (typeof preguntarServicio === 'function') {
                preguntarServicio(jugador1, jugador2);
            } else {
                console.log(`Servicio asignado al jugador: ${seleccion === "2" ? jugador2 : jugador1}`);
            }
        }
    </script>
</body>
</html>
