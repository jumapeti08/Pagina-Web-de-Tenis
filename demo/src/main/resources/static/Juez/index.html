<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Marcador de Tenis - Juez</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="orientacion-aviso">
        <p>📱 Por favor, gira tu dispositivo a posición horizontal</p>
    </div>

    <div class="app-container">
        <!-- 1. BARRA SUPERIOR (6%) -->
        <div class="top-bar">
            <button class="btn-deshacer" onclick="deshacerUltimaAccion()">↩️ Devolver Acción</button>
            <span id="estado" class="badge-estado">EN_JUEGO</span>
        </div>

        <!-- 2. MARCADORES Y PUNTAJES (62%) -->
        <div class="pantalla">
            <!-- JUGADOR / EQUIPO 1 -->
            <div class="jugador">
                <h1 id="nombreJ1">Cargando...</h1>
                <div class="jugador-contenido">
                    <div class="marcador-principal">
                        <div class="item"><span>Games</span><p id="sumarGameJug1">0</p></div>
                        <div class="item"><span>Sets</span><p id="setJug1">0</p></div>
                    </div>
                    <div class="puntos-control">
                        <p class="puntaje" id="puntaje1">0</p>
                        <button class="btn-sumar" onclick="sumarJugador1()">+ Pts E1</button>
                    </div>
                </div>
            </div>

            <div class="divisor"></div>

            <!-- JUGADOR / EQUIPO 2 -->
            <div class="jugador">
                <h1 id="nombreJ2">Cargando...</h1>
                <div class="jugador-contenido">
                    <div class="marcador-principal">
                        <div class="item"><span>Games</span><p id="sumarGameJug2">0</p></div>
                        <div class="item"><span>Sets</span><p id="setJug2">0</p></div>
                    </div>
                    <div class="puntos-control">
                        <p class="puntaje" id="puntaje2">0</p>
                        <button class="btn-sumar" onclick="sumarJugador2()">+ Pts E2</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. TODOS LOS BOTONES ABAJO (32%) -->
        <div class="bottom-controls">
            <!-- Botones de Estadísticas divididos por jugador -->
            <div class="panel-stats-container">
                <!-- Stats Equipo 1 -->
                <div class="panel-stats">
                    <button class="btn-s ace" onclick="registrarStat(1, 'ace')">Ace</button>
                    <button class="btn-s doble" onclick="registrarStat(1, 'dobleFalta')">D.Falta</button>
                    <button class="btn-s primer-falta" onclick="registrarStat(1, '1raFalta')">1ra Falta</button>
                    <button class="btn-s error-no" onclick="registrarStat(1, 'errorNo')">Err. NF</button>
                    <button class="btn-s error-forzado" onclick="registrarStat(1, 'errorForzado')">Err. Forz</button>
                    <button class="btn-s winner" onclick="registrarStat(1, 'winner')">Winner</button>
                </div>

                <div class="divisor"></div>

                <!-- Stats Equipo 2 -->
                <div class="panel-stats">
                    <button class="btn-s ace" onclick="registrarStat(2, 'ace')">Ace</button>
                    <button class="btn-s doble" onclick="registrarStat(2, 'dobleFalta')">D.Falta</button>
                    <button class="btn-s primer-falta" onclick="registrarStat(2, '1raFalta')">1ra Falta</button>
                    <button class="btn-s error-no" onclick="registrarStat(2, 'errorNo')">Err. NF</button>
                    <button class="btn-s error-forzado" onclick="registrarStat(2, 'errorForzado')">Err. Forz</button>
                    <button class="btn-s winner" onclick="registrarStat(2, 'winner')">Winner</button>
                </div>
            </div>

            <!-- Botones Generales de Control -->
            <div class="footer-controls">
                <button class="btn-finalizar" onclick="terminarManual('Normal')">🏁 Terminar</button>
                <button class="btn-w" onclick="terminarManual('W')">🏆 Ganar W</button>
                <button class="btn-r" onclick="terminarManual('R')">🚫 Retiro</button>
                <button class="btn-su" onclick="terminarManual('Su')">⏸️ Suspender</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE ESTADÍSTICAS -->
    <div id="modal-stats" class="modal-overlay">
        <div class="modal-box">
            <h2 style="font-size:2vh; text-align:center; margin-bottom:2%;">📊 Resumen del Partido</h2>
            <div id="container-tablas" style="display: flex; gap: 2%;"></div>
            <div style="display:flex; gap:2%; margin-top:3%;">
                <button id="btn-guardar-bd" class="btn-finalizar" style="flex:1; padding:2%; font-size:1.8vh;" onclick="guardarYPasarSiguienteRonda()">💾 Guardar</button>
                <button style="flex:1; padding:2%; font-size:1.8vh; background:#3a3a3c; color:white; border:none; border-radius:4px;" onclick="cerrarStats()">Salir</button>
            </div>
        </div>
    </div>

    <!-- MODAL SELECCIÓN DOBLES -->
    <div id="modal-seleccion-jugador" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 6000; justify-content: center; align-items: center;">
        <div style="background: #1c1c1e; color: #fff; padding: 3%; border-radius: 8px; width: 80%; max-width: 260px; text-align: center; border: 1px solid #3a3a3c;">
            <h3 style="margin: 0 0 4% 0; font-size: 2vh;">¿Quién realizó la acción?</h3>
            <div style="display: flex; flex-direction: column; gap: 2%;">
                <button id="btn-jugador-1" style="padding: 3%; font-size: 1.8vh; border: none; border-radius: 4px; background-color: #30d158; color: black; font-weight:bold;"></button>
                <button id="btn-jugador-2" style="padding: 3%; font-size: 1.8vh; border: none; border-radius: 4px; background-color: #0a84ff; color: white; font-weight:bold;"></button>
                <button onclick="cerrarModalSeleccion()" style="padding: 2%; font-size: 1.6vh; border: none; border-radius: 4px; background-color: #3a3a3c; color: white;">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
