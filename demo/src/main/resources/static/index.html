<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court Access | Tenis App</title>
  <link rel="stylesheet" href="inicioSesion.css" />
</head>
<body>
  <div class="overlay"></div>
  
  <div class="login-card">
    <div class="header">
      <div class="court-icon"></div>
      <h1>Club de Tenis</h1>
      <p>Acceso al Sistema</p>
    </div>

    <form id="loginForm">
      <div class="input-container">
        <input type="text" id="username" placeholder="Usuario" required>
      </div>

      <div class="input-container">
        <input type="password" id="password" placeholder="Contraseña" required>
      </div>

      <div class="form-footer">
        <!-- Evento click para abrir el modal -->
        <a href="#" class="forgot-link" id="btnForgot">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-submit">INGRESAR</button>
    </form>
  </div>

  <!-- Modal para recuperar contraseña -->
  <div id="modalRecuperar" class="modal-overlay" style="display: none;">
    <div class="login-card modal-content">
      <div class="header">
        <h2>Recuperar Contraseña</h2>
        <p>Ingresa tu nombre real o nombre de acceso</p>
      </div>

      <form id="recuperarForm">
        <div class="input-container">
          <input type="text" id="inputIdentificador" placeholder="Usuario o Nombre de Acceso" required>
        </div>

        <div id="mensajeResultado" class="mensaje-resultado"></div>

        <div class="modal-buttons">
          <button type="submit" class="btn-submit">ENVIAR</button>
          <button type="button" class="btn-cancel" id="btnCerrarModal">CANCELAR</button>
        </div>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
